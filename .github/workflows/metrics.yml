name: Generate GitHub Metrics

on:
  schedule:
    # Run once a day at 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # NOTE: secrets.GITHUB_TOKEN is sufficient for public profile data.
      # A PAT is only needed if you later enable plugins that read
      # private repositories (e.g. `repositories` scope). Not needed here.

      - name: Metrics — languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics/languages.svg
          base: ""
          plugin_languages: "yes"
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8

      - name: Metrics — coding habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics/habits.svg
          base: ""
          plugin_habits: "yes"
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: "yes"
          plugin_habits_charts: "yes"

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update github metrics"
          file_pattern: "github-metrics/*.svg"
